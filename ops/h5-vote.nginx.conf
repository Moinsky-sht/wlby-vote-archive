server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 49.233.245.234 _;

    root /www/wwwroot/--H5-/dist/client;
    index index.html;

    client_max_body_size 100m;

    access_log /var/log/nginx/h5-vote.access.log;
    error_log /var/log/nginx/h5-vote.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /www/wwwroot/--H5-/data/uploads/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        alias /www/wwwroot/--H5-/outputs/generated-component-backgrounds/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri @node_assets;
    }

    location @node_assets {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
